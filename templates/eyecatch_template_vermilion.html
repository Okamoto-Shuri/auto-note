<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>Eyecatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --vermilion-light: #FF6247;
      --vermilion-main: #FF321A;
      --vermilion-deep: #D81A05;
      --vermilion-glow: rgba(255, 50, 26, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #F5EEE4;
      /* 落ち着きのある自然で上品なクリームベージュ */
      font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    /* 一流デザイナー仕様: 幾何学美とエディトリアルディテールを宿した朱色グラデーションフレーム */
    .designer-frame {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    /* 1. 外周メインフレーム（サテン朱色グラデーション＆微細シャドウ） */
    .frame-main {
      position: absolute;
      inset: 0;
      border: 15px solid transparent;
      border-image: linear-gradient(135deg,
          #FF684E 0%,
          #FF321A 22%,
          #FF7D65 45%,
          #D41804 70%,
          #FF381F 100%) 1;
      box-shadow:
        inset 0 0 18px rgba(255, 50, 26, 0.12),
        0 0 22px var(--vermilion-glow);
    }

    /* 2. 内側フローティング・ヘアライン（洗練されたダブルボーダー効果） */
    .frame-inner-line {
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(255, 60, 35, 0.28);
    }

    /* 3. 四隅のプレシジョン・コーナー装飾（建築的・幾何学的なL字ブラケット＆ダイヤ） */
    .corner {
      position: absolute;
      width: 32px;
      height: 32px;
    }

    .corner-tl {
      top: 18px;
      left: 18px;
    }

    .corner-tr {
      top: 18px;
      right: 18px;
      transform: scaleX(-1);
    }

    .corner-bl {
      bottom: 18px;
      left: 18px;
      transform: scaleY(-1);
    }

    .corner-br {
      bottom: 18px;
      right: 18px;
      transform: scale(-1);
    }

    .corner-bracket {
      position: absolute;
      top: 0;
      left: 0;
      width: 22px;
      height: 22px;
      border-top: 3px solid #FF321A;
      border-left: 3px solid #FF321A;
      filter: drop-shadow(0 0 4px rgba(255, 50, 26, 0.4));
    }

    .corner-diamond {
      position: absolute;
      top: -2px;
      left: -2px;
      width: 6px;
      height: 6px;
      background: linear-gradient(135deg, #FF7D65, #D41804);
      transform: rotate(45deg);
      box-shadow: 0 0 6px rgba(255, 50, 26, 0.6);
    }

    .corner-cross {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 6px;
      height: 6px;
      border-right: 1px solid rgba(255, 60, 35, 0.45);
      border-bottom: 1px solid rgba(255, 60, 35, 0.45);
    }

    /* 4. エディトリアル・マイクロタイポグラフィ（枠に刻印された刻み・タグ） */
    .frame-tag {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.22em;
      color: #FF321A;
      opacity: 0.88;
      background: rgba(245, 238, 228, 0.95);
      padding: 2px 12px;
      border-radius: 2px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    .frame-tag-tl {
      top: 18px;
      left: 56px;
    }

    .frame-tag-br {
      bottom: 18px;
      right: 56px;
    }

    .tag-marker {
      font-size: 10px;
      color: #D41804;
    }

    .tag-ruler {
      display: flex;
      gap: 3px;
      align-items: center;
    }

    .tag-ruler span {
      width: 2px;
      height: 8px;
      background: rgba(255, 50, 26, 0.4);
    }

    .tag-ruler span:nth-child(2) {
      height: 12px;
      background: #FF321A;
    }

    /* 5. 枠の四辺の中央ノッチ（インジケーターアクセント） */
    .frame-notch {
      position: absolute;
      background: #FF321A;
      box-shadow: 0 0 8px rgba(255, 50, 26, 0.5);
    }

    .notch-top {
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 3px;
    }

    .notch-bottom {
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 3px;
    }

    .notch-left {
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 24px;
    }

    .notch-right {
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 24px;
    }

    /* 背景: 白飛びを抑え、ほんのり温かみのあるクリームトーンのグラデーション */
    .bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, #FAF2E6 0%, #F4E8D7 55%, #EADBCA 100%);
      overflow: hidden;
    }

    /* 鮮やかで柔らかく溶け込むカラーオーブ（パステル＆ビビッドの多層ブレンド） */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      mix-blend-mode: multiply;
      will-change: transform;
    }

    /* 左上: ピーチコーラル〜サンセットアプリコット */
    .orb-a {
      width: 680px;
      height: 680px;
      top: -180px;
      left: -140px;
      background: radial-gradient(circle, rgba(255, 120, 85, 0.4) 0%, rgba(255, 175, 135, 0.18) 65%, transparent 100%);
    }

    /* 右下: 爽快なフレッシュターコイズ・ミントシアン（クリック欲を誘う差し色） */
    .orb-b {
      width: 650px;
      height: 650px;
      bottom: -160px;
      right: -120px;
      background: radial-gradient(circle, rgba(40, 205, 220, 0.34) 0%, rgba(120, 220, 230, 0.14) 65%, transparent 100%);
    }

    /* 右上: ウォームハニーゴールド・サンシャインアンバー */
    .orb-c {
      width: 620px;
      height: 620px;
      top: -100px;
      right: 8%;
      background: radial-gradient(circle, rgba(255, 185, 45, 0.38) 0%, rgba(255, 215, 110, 0.16) 65%, transparent 100%);
    }

    /* 左下: ソフトローズ・エレガントライラック */
    .orb-d {
      width: 600px;
      height: 600px;
      bottom: -130px;
      left: 8%;
      background: radial-gradient(circle, rgba(235, 95, 175, 0.32) 0%, rgba(205, 135, 225, 0.14) 65%, transparent 100%);
    }

    /* 中央の抜け感・柔らかなクリーム光彩（白飛びを防ぎ自然な階調を維持） */
    .center-highlight {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(255, 248, 236, 0.45) 0%, rgba(255, 244, 230, 0.1) 60%, transparent 85%);
    }

    /* 上質なモダンテックグリッド（薄いトーンで知的さをプラス） */
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(175, 145, 120, 0.11) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(175, 145, 120, 0.11) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 85% 75% at 50% 50%, rgba(0, 0, 0, 0.85) 20%, rgba(0, 0, 0, 0.05) 85%);
    }

    /* 高級感あるペーパーノイズテクスチャ */
    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.035;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    /* 前景コンテンツ: 完全中央揃え・超特大2段デカデカレイアウト */
    .content {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      padding: 30px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* PIVOTスタイルのカテゴリ・ジャンルバッジ（大型化＆視認性アップ） */
    .kicker-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 10px 32px;
      background: rgba(253, 249, 242, 0.94);
      border: 2px solid transparent;
      border-image: linear-gradient(135deg, #FF6247, #FF321A) 1;
      box-shadow:
        0 4px 18px rgba(255, 50, 26, 0.15),
        0 1px 3px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(12px);
      margin-bottom: 20px;
    }

    .kicker-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FF6247, #D81A05);
      box-shadow: 0 0 10px rgba(255, 50, 26, 0.5);
      flex-shrink: 0;
    }

    .kicker-text {
      font-size: 36px;
      /* バッジ文字も拡大 */
      font-weight: 900;
      letter-spacing: 0.18em;
      color: #FF321A;
      /* 朱色 */
      text-transform: uppercase;
    }

    /* タイトル台座: 朱の余韻はここ。見当ズレのfilterは .title-ink に分離する */
    .title-stage {
      position: relative;
      display: flex;
      justify-content: center;
      max-width: 98%;
    }

    .title-stage::before {
      content: "";
      position: absolute;
      inset: 10% -4%;
      background: radial-gradient(ellipse 72% 58% at 50% 58%,
          rgba(216, 26, 5, 0.14) 0%,
          rgba(255, 80, 40, 0.05) 46%,
          transparent 74%);
      filter: blur(20px);
      z-index: -1;
      pointer-events: none;
    }

    /* 活字上面の光 → 朱色の見当ズレ（輪郭のままずらす）→ 紙に落ちる影 */
    .title-ink {
      filter:
        drop-shadow(0 -2px 0 rgba(255, 246, 232, 0.7))
        drop-shadow(10px 9px 0 rgba(255, 50, 26, 0.42))
        drop-shadow(0 22px 40px rgba(70, 16, 8, 0.18));
    }

    /* 漆字: フラットな黒ではなく、漆器のように朱を含んだ濃墨 */
    .title {
      position: relative;
      margin: 0;
      font-size: 220px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.04em;
      max-width: 100%;
      word-break: keep-all;
      overflow-wrap: break-word;
      /* 茶褐の照り → 深い漆 → 朱の底。2段タイトルの上端と下端で階調が読めるようにする */
      background-image: linear-gradient(168deg,
          #C47858 0%,
          #6B3224 16%,
          #2A1410 40%,
          #1C0C0A 58%,
          #8B1A0C 84%,
          #E02410 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    /* 下部アクセント装飾（朱色グラデーションバー＆ひし形） */
    .bottom-accent {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 24px;
    }

    .accent-line {
      width: 90px;
      height: 5px;
      background: linear-gradient(90deg, #FF6247, #D81A05);
      border-radius: 2px;
      box-shadow: 0 2px 10px rgba(255, 50, 26, 0.3);
    }

    .accent-diamond {
      width: 10px;
      height: 10px;
      background: #FF321A;
      transform: rotate(45deg);
      box-shadow: 0 0 8px rgba(255, 50, 26, 0.45);
    }

    /* キーワード強調: 同じ朱墨の濃い一滴。全面着色ではなく要所だけ朱を立てる */
    .highlight {
      background-image: linear-gradient(165deg, #FF6E4A 0%, #FF321A 42%, #B81408 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>

<body>

  <!-- 一流デザイナー仕様: 幾何学美とエディトリアルディテールを宿した朱色フレーム -->
  <div class="designer-frame">
    <div class="frame-main"></div>
    <div class="frame-inner-line"></div>

    <!-- 四隅のプレシジョン・コーナー装飾 -->
    <div class="corner corner-tl">
      <div class="corner-bracket"></div>
      <div class="corner-diamond"></div>
      <div class="corner-cross"></div>
    </div>
    <div class="corner corner-tr">
      <div class="corner-bracket"></div>
      <div class="corner-diamond"></div>
      <div class="corner-cross"></div>
    </div>
    <div class="corner corner-bl">
      <div class="corner-bracket"></div>
      <div class="corner-diamond"></div>
      <div class="corner-cross"></div>
    </div>
    <div class="corner corner-br">
      <div class="corner-bracket"></div>
      <div class="corner-diamond"></div>
      <div class="corner-cross"></div>
    </div>

    <!-- 枠に刻印されたエディトリアル・マイクロディテール -->
    <div class="frame-tag frame-tag-tl">
      <span class="tag-marker">■</span>
      <span class="tag-text">SPECIAL PERSPECTIVE</span>
      <div class="tag-ruler">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div class="frame-tag frame-tag-br">
      <div class="tag-ruler">
        <span></span><span></span><span></span>
      </div>
      <span class="tag-text">EDITION 2026 // ISSUE</span>
      <span class="tag-marker">▲</span>
    </div>

    <!-- 四辺の中央ノッチ -->
    <div class="frame-notch notch-top"></div>
    <div class="frame-notch notch-bottom"></div>
    <div class="frame-notch notch-left"></div>
    <div class="frame-notch notch-right"></div>
  </div>

  <!-- クリーミー＆カラフルな背景 -->
  <div class="bg">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="orb orb-d"></div>
    <div class="center-highlight"></div>
    <div class="grid"></div>
    <div class="grain"></div>
  </div>

  <!-- image_gen用の視覚的参考資料。配色・構図・余白を読み取る。コピー・文言置換・レンダリングは禁止。 -->
  <div class="content">
    <div class="kicker-badge">
      <div class="kicker-dot"></div>
      <div class="kicker-text">CATEGORY // 2026</div>
    </div>
    <!--h1タグはそれぞれ、１行あたり7文字が上限-->
    <div class="title-stage">
      <div class="title-ink">
        <h1 class="title">メインタイトル<br>インパクト</h1>
      </div>
    </div>
    <div class="bottom-accent">
      <div class="accent-line"></div>
      <div class="accent-diamond"></div>
      <div class="accent-line"></div>
    </div>
  </div>

</body>

</html>
