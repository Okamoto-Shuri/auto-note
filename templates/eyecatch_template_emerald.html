<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>Eyecatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --vermilion-light: #1BB888;
      --vermilion-main: #0B8F6A;
      --vermilion-deep: #06664A;
      --vermilion-glow: rgba(11, 143, 106, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #EEF5F1;
      /* 落ち着きのある自然で上品なミントアイボリー */
      font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    /* 一流デザイナー仕様: 幾何学美とエディトリアルディテールを宿した翠色グラデーションフレーム */
    .designer-frame {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    /* 1. 外周メインフレーム（サテン翠色グラデーション＆微細シャドウ） */
    .frame-main {
      position: absolute;
      inset: 0;
      border: 15px solid transparent;
      border-image: linear-gradient(135deg,
          #24C48A 0%,
          #0B8F6A 22%,
          #4ED9A8 45%,
          #055540 70%,
          #0D9F73 100%) 1;
      box-shadow:
        inset 0 0 18px rgba(11, 143, 106, 0.12),
        0 0 22px var(--vermilion-glow);
    }

    /* 2. 内側フローティング・ヘアライン（洗練されたダブルボーダー効果） */
    .frame-inner-line {
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(13, 159, 115, 0.28);
    }

    /* 3. 四隅のプレシジョン・コーナー装飾（建築的・幾何学的なL字ブラケット＆ダイヤ） */
    .corner {
      position: absolute;
      width: 32px;
      height: 32px;
    }

    .corner-tl {
      top: 18px;
      left: 18px;
    }

    .corner-tr {
      top: 18px;
      right: 18px;
      transform: scaleX(-1);
    }

    .corner-bl {
      bottom: 18px;
      left: 18px;
      transform: scaleY(-1);
    }

    .corner-br {
      bottom: 18px;
      right: 18px;
      transform: scale(-1);
    }

    .corner-bracket {
      position: absolute;
      top: 0;
      left: 0;
      width: 22px;
      height: 22px;
      border-top: 3px solid #0B8F6A;
      border-left: 3px solid #0B8F6A;
      filter: drop-shadow(0 0 4px rgba(11, 143, 106, 0.4));
    }

    .corner-diamond {
      position: absolute;
      top: -2px;
      left: -2px;
      width: 6px;
      height: 6px;
      background: linear-gradient(135deg, #4ED9A8, #055540);
      transform: rotate(45deg);
      box-shadow: 0 0 6px rgba(11, 143, 106, 0.6);
    }

    .corner-cross {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 6px;
      height: 6px;
      border-right: 1px solid rgba(13, 159, 115, 0.45);
      border-bottom: 1px solid rgba(13, 159, 115, 0.45);
    }

    /* 4. エディトリアル・マイクロタイポグラフィ（枠に刻印された刻み・タグ） */
    .frame-tag {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.22em;
      color: #0B8F6A;
      opacity: 0.88;
      background: rgba(236, 248, 240, 0.95);
      padding: 2px 12px;
      border-radius: 2px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    .frame-tag-tl {
      top: 18px;
      left: 56px;
    }

    .frame-tag-br {
      bottom: 18px;
      right: 56px;
    }

    .tag-marker {
      font-size: 8px;
      color: #055540;
    }

    .tag-ruler {
      display: flex;
      gap: 3px;
      align-items: center;
    }

    .tag-ruler span {
      width: 2px;
      height: 8px;
      background: rgba(11, 143, 106, 0.4);
    }

    .tag-ruler span:nth-child(2) {
      height: 12px;
      background: #0B8F6A;
    }

    /* 5. 枠の四辺の中央ノッチ（インジケーターアクセント） */
    .frame-notch {
      position: absolute;
      background: #0B8F6A;
      box-shadow: 0 0 8px rgba(11, 143, 106, 0.5);
    }

    .notch-top {
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 3px;
    }

    .notch-bottom {
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 3px;
    }

    .notch-left {
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 24px;
    }

    .notch-right {
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 24px;
    }

    /* 背景: 白飛びを抑え、ほんのり冷たいミントアイボリーのグラデーション */
    .bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, #F2F8F4 0%, #E4F0E8 55%, #D4E4DA 100%);
      overflow: hidden;
    }

    /* 鮮やかで柔らかく溶け込むカラーオーブ（パステル＆ビビッドの多層ブレンド） */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      mix-blend-mode: multiply;
      will-change: transform;
    }

    /* 左上: ミントエメラルド〜フレッシュリーフ */
    .orb-a {
      width: 680px;
      height: 680px;
      top: -180px;
      left: -140px;
      background: radial-gradient(circle, rgba(45, 200, 140, 0.4) 0%, rgba(140, 230, 190, 0.18) 65%, transparent 100%);
    }

    /* 右下: コーラルピーチ（クリック欲を誘う差し色） */
    .orb-b {
      width: 650px;
      height: 650px;
      bottom: -160px;
      right: -120px;
      background: radial-gradient(circle, rgba(255, 130, 90, 0.32) 0%, rgba(255, 185, 145, 0.14) 65%, transparent 100%);
    }

    /* 右上: ウォームハニーゴールド・サンシャインアンバー */
    .orb-c {
      width: 620px;
      height: 620px;
      top: -100px;
      right: 8%;
      background: radial-gradient(circle, rgba(230, 190, 70, 0.34) 0%, rgba(240, 215, 130, 0.14) 65%, transparent 100%);
    }

    /* 左下: ソフトセージ・ダスティティール */
    .orb-d {
      width: 600px;
      height: 600px;
      bottom: -130px;
      left: 8%;
      background: radial-gradient(circle, rgba(90, 170, 155, 0.30) 0%, rgba(150, 200, 185, 0.14) 65%, transparent 100%);
    }

    /* 中央の抜け感・柔らかなミント光彩（白飛びを防ぎ自然な階調を維持） */
    .center-highlight {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(240, 255, 246, 0.45) 0%, rgba(232, 248, 238, 0.1) 60%, transparent 85%);
    }

    /* 上質なモダンテックグリッド（薄いトーンで知的さをプラス） */
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(120, 165, 140, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(120, 165, 140, 0.12) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 85% 75% at 50% 50%, rgba(0, 0, 0, 0.85) 20%, rgba(0, 0, 0, 0.05) 85%);
    }

    /* 高級感あるペーパーノイズテクスチャ */
    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.035;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    /* 前景コンテンツ: 完全中央揃え・超特大2段デカデカレイアウト */
    .content {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      padding: 30px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* PIVOTスタイルのカテゴリ・ジャンルバッジ（大型化＆視認性アップ） */
    .kicker-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 10px 32px;
      background: rgba(246, 252, 248, 0.94);
      border: 2px solid transparent;
      border-image: linear-gradient(135deg, #1BB888, #0B8F6A) 1;
      box-shadow:
        0 4px 18px rgba(11, 143, 106, 0.15),
        0 1px 3px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(12px);
      margin-bottom: 20px;
    }

    .kicker-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1BB888, #06664A);
      box-shadow: 0 0 10px rgba(11, 143, 106, 0.5);
      flex-shrink: 0;
    }

    .kicker-text {
      font-size: 30px;
      /* バッジ文字も拡大 */
      font-weight: 900;
      letter-spacing: 0.18em;
      color: #0B8F6A;
      /* 翠色 */
      text-transform: uppercase;
    }

    /* タイトル台座: 翠の余韻はここ。見当ズレのfilterは .title-ink に分離する */
    .title-stage {
      position: relative;
      display: flex;
      justify-content: center;
      max-width: 98%;
    }

    .title-stage::before {
      content: "";
      position: absolute;
      inset: 10% -4%;
      background: radial-gradient(ellipse 72% 58% at 50% 58%,
          rgba(6, 102, 74, 0.14) 0%,
          rgba(27, 184, 136, 0.05) 46%,
          transparent 74%);
      filter: blur(20px);
      z-index: -1;
      pointer-events: none;
    }

    /* 活字上面の光 → 翠色の見当ズレ（輪郭のままずらす）→ 紙に落ちる影 */
    .title-ink {
      filter:
        drop-shadow(0 -2px 0 rgba(232, 255, 244, 0.7))
        drop-shadow(10px 9px 0 rgba(11, 143, 106, 0.42))
        drop-shadow(0 22px 40px rgba(8, 40, 28, 0.18));
    }

    /* 漆字: フラットな黒ではなく、青磁のように翠を含んだ濃墨 */
    .title {
      position: relative;
      margin: 0;
      font-size: 200px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.04em;
      max-width: 100%;
      word-break: keep-all;
      overflow-wrap: break-word;
      /* 青磁の照り → 深い翠黒 → 翠の底。2段タイトルの上端と下端で階調が読めるようにする */
      background-image: linear-gradient(168deg,
          #5CBA96 0%,
          #1A4A38 16%,
          #0C1814 40%,
          #0A1410 58%,
          #0A6B4A 84%,
          #0EC98A 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    /* 下部アクセント装飾（翠色グラデーションバー＆ひし形） */
    .bottom-accent {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 24px;
    }

    .accent-line {
      width: 90px;
      height: 5px;
      background: linear-gradient(90deg, #1BB888, #06664A);
      border-radius: 2px;
      box-shadow: 0 2px 10px rgba(11, 143, 106, 0.3);
    }

    .accent-diamond {
      width: 10px;
      height: 10px;
      background: #0B8F6A;
      transform: rotate(45deg);
      box-shadow: 0 0 8px rgba(11, 143, 106, 0.45);
    }

    /* キーワード強調: 同じ翠墨の濃い一滴。全面着色ではなく要所だけ翠を立てる */
    .highlight {
      background-image: linear-gradient(165deg, #3ECF9A 0%, #0B8F6A 42%, #0A6B4A 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>

<body>

  <!-- 一流デザイナー仕様: 幾何学美とエディトリアルディテールを宿した翠色フレーム -->
  <div class="designer-frame">
    <div class="frame-main"></div>
    <div class="frame-inner-line"></div>

    <!-- 四隅のプレシジョン・コーナー装飾 -->
    <div class="corner corner-tl">
      <div class="corner-bracket"></div>
      <div class="corner-diamond"></div>
      <div class="corner-cross"></div>
    </div>
    <div class="corner corner-tr">
      <div class="corner-bracket"></div>
      <div class="corner-diamond"></div>
      <div class="corner-cross"></div>
    </div>
    <div class="corner corner-bl">
      <div class="corner-bracket"></div>
      <div class="corner-diamond"></div>
      <div class="corner-cross"></div>
    </div>
    <div class="corner corner-br">
      <div class="corner-bracket"></div>
      <div class="corner-diamond"></div>
      <div class="corner-cross"></div>
    </div>

    <!-- 枠に刻印されたエディトリアル・マイクロディテール -->
    <div class="frame-tag frame-tag-tl">
      <span class="tag-marker">■</span>
      <span class="tag-text">SPECIAL PERSPECTIVE</span>
      <div class="tag-ruler">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div class="frame-tag frame-tag-br">
      <div class="tag-ruler">
        <span></span><span></span><span></span>
      </div>
      <span class="tag-text">EDITION 2026 // ISSUE</span>
      <span class="tag-marker">▲</span>
    </div>

    <!-- 四辺の中央ノッチ -->
    <div class="frame-notch notch-top"></div>
    <div class="frame-notch notch-bottom"></div>
    <div class="frame-notch notch-left"></div>
    <div class="frame-notch notch-right"></div>
  </div>

  <!-- ミントアイボリー＆カラフルな背景 -->
  <div class="bg">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="orb orb-d"></div>
    <div class="center-highlight"></div>
    <div class="grid"></div>
    <div class="grain"></div>
  </div>

  <!--
  使い方（note-article-publish / eyecatch-generator から参照）:
  1. このファイルをそのままコピーして作業用ファイルにする（このテンプレート自体は直接編集しない）。
  2. kicker-text（ジャンル・キーワード等）を記事に合わせて置換（例: "AI CODING 2026" "SEO STRATEGY"）。
  3. title（記事タイトル）を置換。
     ★重要: 中央2段でデカデカと魅せるため、1行目と2行目の区切りに <br> を手動で挿入する。
     （目安は1行あたり5〜8文字程度。文字が超特大のため、短くパンチのある文言にする）
  4. 文字数が多い／少ない場合は .title の font-size（既定170px〜200px）を140px〜220pxの範囲で調整してよい。
  5. 要所だけ翠を立てたい場合は <span class="highlight">キーワード</span>。タイトル全体は漆字のままでよい。
-->
  <div class="content">
    <div class="kicker-badge">
      <div class="kicker-dot"></div>
      <div class="kicker-text">CATEGORY // 2026</div>
    </div>
    <!--h1タグはそれぞれ、１行あたり7文字が上限-->
    <div class="title-stage">
      <div class="title-ink">
        <h1 class="title">メインタイトル<br>インパクト</h1>
      </div>
    </div>
    <div class="bottom-accent">
      <div class="accent-line"></div>
      <div class="accent-diamond"></div>
      <div class="accent-line"></div>
    </div>
  </div>

</body>

</html>
