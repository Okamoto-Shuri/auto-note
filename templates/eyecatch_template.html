<title>Eyecatch</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: #0a0a12;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }

  /* 背景: モダンなグラデーションメッシュ + グリッド + ノイズ */
  .bg {
    position: absolute; inset: 0;
    background: radial-gradient(120% 120% at 10% 100%, #12121e 0%, #0a0a12 55%);
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(110px);
    opacity: 0.55;
  }
  .orb-a { width: 620px; height: 620px; top: -180px; left: -120px; background: #7c5cff; }
  .orb-b { width: 560px; height: 560px; bottom: -200px; right: -140px; background: #22d3ee; opacity: 0.4; }
  .orb-c { width: 500px; height: 500px; top: 30%; right: 8%; background: #ff6b57; opacity: 0.28; }
  .grid {
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 80px),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 80px);
    mask-image: radial-gradient(120% 120% at 50% 50%, #000 40%, transparent 90%);
  }
  .grain {
    position: absolute; inset: 0;
    opacity: 0.05;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* 前景コンテンツ: 大きく・太く・左寄せ */
  .content {
    position: relative;
    z-index: 2;
    width: 100%; height: 100%;
    box-sizing: border-box;
    padding: 84px 96px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
  }
  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #ffd7b0;
    margin-bottom: 32px;
  }
  .kicker::before {
    content: "";
    width: 10px; height: 10px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff9d5c, #ff6b57);
    flex: none;
  }
  .title {
    margin: 0;
    font-size: 104px;
    font-weight: 900;
    line-height: 1.14;
    letter-spacing: -0.02em;
    color: #f9f9fb;
    max-width: 96%;
    text-shadow: 0 8px 60px rgba(0,0,0,0.45);
  }
  .accent-bar {
    margin-top: 40px;
    width: 120px; height: 6px;
    border-radius: 999px;
    background: linear-gradient(90deg, #7c5cff, #22d3ee);
  }
</style>

<div class="bg">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
  <div class="grid"></div>
  <div class="grain"></div>
</div>

<!--
  使い方（note-article-publish スキルから参照）:
  1. このファイルをそのままコピーして作業用ファイルにする（このテンプレート自体は直接編集しない）。
  2. {{KICKER}} を記事のジャンル・キーワード等（例: "AI CODING TOOLS" "2026年9月版"）に置換。
  3. {{TITLE}} を記事タイトルに置換。長いタイトルは自然な位置に <br> を手動で入れて2〜3行に収める
     （文字が大きいため、1行に詰め込みすぎない。目安は1行10〜14文字程度）。
  4. 文字数が多い／少ない場合は .title の font-size（既定104px）を90px〜130pxの範囲で調整してよい。
-->
<div class="content">
  <div class="kicker">{{KICKER}}</div>
  <h1 class="title">{{TITLE}}</h1>
  <div class="accent-bar"></div>
</div>
