[mcp_servers.note_publisher]
command = "node"
args = ["scripts/note_mcp_server.mjs"]
cwd = ".."
required = true
startup_timeout_sec = 10
tool_timeout_sec = 180
enabled_tools = ["note_session_status", "open_note_login", "publish_note"]
default_tools_approval_mode = "approve"

[mcp_servers.note_publisher.tools.note_session_status]
approval_mode = "approve"

[mcp_servers.note_publisher.tools.open_note_login]
approval_mode = "approve"

[mcp_servers.note_publisher.tools.publish_note]
approval_mode = "approve"
